<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>採用ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8F6; --surface:#FFFFFF; --surface2:#F7FBFA; --ink:#1D2A30; --muted:#5C6C73; --line:#D9E6E3;
  --primary:#0B8F80; --primary-ink:#FFFFFF; --primary-soft:#DDF3EF; --star:#F2AE00; --danger:#D23F3F;
  --soon:#FFF1C2; --soon-ink:#6E5000; --warn:#FFE3DC; --warn-ink:#8A2E16; --shadow:0 2px 0 rgba(29,42,48,.06);
  --s-doc:#4C84F0; --s-first:#8A63E8; --s-second:#0A9BBA; --s-joined:#B8890B; --del:#E9EEF2; --del-ink:#3D4A55; --s-final:#E9821C; --s-offer:#1FA25C; --s-out:#8C97A3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181A; --surface:#1A2326; --surface2:#162023; --ink:#E6EFED; --muted:#9AADAD; --line:#2A393B;
    --primary:#2BC1AE; --primary-ink:#06231F; --primary-soft:#173A36; --star:#FFC93D; --danger:#FF7676;
    --soon:#433A16; --soon-ink:#FFE08A; --warn:#4A2A22; --warn-ink:#FFC2B0; --shadow:none;
    --s-doc:#6F9CFF; --s-first:#A88BFF; --s-second:#38C9E0; --s-joined:#E5BE45; --del:#243034; --del-ink:#C8D5D6; --s-final:#FFA14A; --s-offer:#3FCB7E; --s-out:#8C97A3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181A; --surface:#1A2326; --surface2:#162023; --ink:#E6EFED; --muted:#9AADAD; --line:#2A393B;
  --primary:#2BC1AE; --primary-ink:#06231F; --primary-soft:#173A36; --star:#FFC93D; --danger:#FF7676;
  --soon:#433A16; --soon-ink:#FFE08A; --warn:#4A2A22; --warn-ink:#FFC2B0; --shadow:none;
  --s-doc:#6F9CFF; --s-first:#A88BFF; --s-second:#38C9E0; --s-joined:#E5BE45; --del:#243034; --del-ink:#C8D5D6; --s-final:#FFA14A; --s-offer:#3FCB7E; --s-out:#8C97A3;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--primary)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--danger);color:#fff}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;border-radius:10px 10px 0 0}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.tabs button:hover{background:var(--surface2)}

.banner{display:none;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:var(--soon);color:var(--soon-ink);font-size:14px}
.banner.show{display:block}

.notices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.notice{border-radius:16px;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface)}
.notice.soon{background:var(--soon);border-color:transparent;color:var(--soon-ink)}
.notice.stale{background:var(--warn);border-color:transparent;color:var(--warn-ink)}
.notice.del{background:var(--del);border-color:transparent;color:var(--del-ink)}
.notice h3{margin:0 0 6px;font-size:14px}
.notice ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.notice button{border:0;background:transparent;padding:2px 0;cursor:pointer;color:inherit;text-align:left;font-size:14px}
.notice button b{text-decoration:underline;text-underline-offset:3px}

.stages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip .n{font-weight:800;color:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar select,.selpill{padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);max-width:100%}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--ink)}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1120px}
th{text-align:left;font-size:13px;font-weight:700;color:var(--muted);padding:12px 14px;border-bottom:1.5px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.nm{font-weight:700;font-size:15px}
.kana{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}

.track{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dots{display:flex;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:block}
.dots b{width:14px;height:3px;background:var(--line);display:block}
.dots i.done{background:var(--c);border-color:var(--c)}
.dots b.done{background:var(--c)}
.dots i.now{background:var(--c);border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.track .lbl{font-weight:700;font-size:13px;color:var(--c)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.when{white-space:nowrap}
.when.soon{display:inline-block;background:var(--soon);color:var(--soon-ink);padding:1px 8px;border-radius:8px;font-weight:700}
.when.past{color:var(--muted)}
.rl{font-size:11px;color:var(--muted);display:block}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--primary-soft);color:var(--ink);margin:1px 2px 1px 0;white-space:nowrap}
.tag.agent{background:color-mix(in srgb,var(--s-final) 18%,transparent)}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--warn);color:var(--warn-ink);margin-left:6px;white-space:nowrap}

.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:stretch}
.col{background:color-mix(in srgb,var(--c) 9%,var(--bg));border:1.5px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:14px;padding:12px 10px;min-height:300px;display:flex;flex-direction:column;gap:10px;transition:background .15s}
.col.out{background:transparent}
.col.over{background:color-mix(in srgb,var(--c) 26%,var(--bg));border-color:var(--c)}
.col h3{margin:0 2px;font-size:14px;white-space:nowrap;gap:6px;display:flex;justify-content:space-between;align-items:center;color:var(--c)}
.col h3 span{font-size:13px;background:var(--surface);color:var(--ink);border-radius:999px;padding:0 9px}
.card{background:var(--surface);border-radius:12px;padding:12px 11px 10px;border:1.5px solid var(--line);cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%;display:flex;flex-direction:column;gap:7px}
.card.dragging{opacity:.45}
.card .meta{font-size:12px;color:var(--muted);line-height:1.5}
.card .nx{font-size:12px;line-height:1.5}
.card .nx.soon{align-self:flex-start;font-weight:700;color:var(--soon-ink);background:var(--soon);padding:3px 8px;border-radius:8px}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px;border-top:1px solid var(--line);padding-top:7px}
.card .foot .star{color:var(--star)}
.card .flag{align-self:flex-start;margin:0}
.col .empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 4px}
@media (max-width:720px){
  .board{grid-template-columns:1fr;overflow-x:visible}
  .col{min-height:0}
}

.state{padding:48px 20px;text-align:center;color:var(--muted)}
.state strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* jobs & agents */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.jcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.jcard:hover{border-color:var(--primary)}
.jcard h3{margin:0;font-size:17px}
.jcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nums{display:flex;gap:14px;margin-top:4px}
.nums div{font-size:12px;color:var(--muted)}
.nums b{display:block;font-size:20px;color:var(--ink);font-weight:800;line-height:1.2}
.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:700;cursor:pointer;padding:0;font-size:13px;text-align:left}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sectionhead p{margin:0;color:var(--muted);font-size:14px}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.spanel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.spanel h3{margin:0 0 12px;font-size:16px}
.totals{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:12px}
.totals div{font-size:13px;color:var(--muted)}
.totals b{display:block;font-size:26px;color:var(--ink);font-weight:800;line-height:1.2}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:16px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--c,var(--primary));border-radius:999px}
.bar .val{text-align:right;font-weight:700;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px;overflow-x:auto}
.cols .cc{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols .cb{width:70%;background:var(--primary);border-radius:8px 8px 0 0;min-height:2px}
.cols .cv{font-size:12px;font-weight:700}
.cols .cl{font-size:11px;color:var(--muted);white-space:nowrap}

/* mail tab */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tpl{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.tpl h4{margin:0 0 4px;font-size:16px}
.tpl pre{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0 0;max-height:220px;overflow:auto}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.ph code{font-family:inherit;font-size:12px;background:var(--primary-soft);border-radius:6px;padding:1px 8px}

/* dialogs */
dialog{border:0;border-radius:22px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink)}
dialog.narrow{width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,22,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg>header{padding:18px 22px 8px;display:flex;justify-content:space-between;align-items:center}
.dlg h2{margin:0;font-size:20px;font-weight:800}
.dlg .body{padding:6px 22px 14px;overflow-y:auto}
.dlg>footer{padding:12px 22px 18px;display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:18px 0 0}
fieldset:first-child{margin-top:4px}
legend{font-weight:800;font-size:15px;color:var(--primary);margin-bottom:8px;padding:0}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea,.inp{width:100%;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2)}
.f textarea,textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.f input:disabled,.f select:disabled,.f textarea:disabled{opacity:.75}
.f input[type=checkbox]{width:auto;padding:0}
.f label.chk{display:inline-flex;white-space:nowrap}
.req{color:var(--danger)}
.err{color:var(--danger);font-size:13px;margin-top:4px;display:none}
.err.show{display:block}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.stagepick{display:flex;flex-wrap:wrap;gap:6px}
.stagepick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.stagepick button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:var(--star)}
.x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.box{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface2)}
.box+.box{margin-top:10px}
.agentbox{border-color:color-mix(in srgb,var(--s-final) 45%,var(--line));background:color-mix(in srgb,var(--s-final) 6%,var(--surface))}
.round h4{margin:0;font-size:15px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.calrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);margin:0;font-size:13px;cursor:pointer}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slots button{border:1.5px solid var(--primary);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:700}
.slots button:hover{background:var(--primary-soft)}
.calmsg{margin-top:6px}
.calmsg.bad{color:var(--danger)}
.evst{font-size:12px;font-weight:700}
.evst.ok{color:var(--s-offer)}
.evst.warn{color:var(--s-final)}
.picker{position:relative}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:44px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-weight:700}
.pk-rm{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:2px 6px;border-radius:999px}
.pk-in{flex:1 1 140px;border:0;background:transparent;padding:4px 6px;min-width:120px}
.pk-in:focus{outline:none}
.pk-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;max-height:240px;overflow:auto;padding:4px}
.pk-hit{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.pk-hit:hover,.pk-hit:focus{background:var(--surface2)}
.pk-hit small{display:block;color:var(--muted)}
.pk-none{padding:8px 10px;font-size:13px;color:var(--muted)}
.rev{border-top:1px dashed var(--line);padding:8px 0}
.rev:first-child{border-top:0}
.rev .who{font-weight:700;font-size:13px}
.rev p{margin:2px 0 0;font-size:14px;white-space:pre-wrap}
.myrev{margin-top:8px;padding-top:8px;border-top:1.5px solid var(--line)}
.docrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.docrow:last-child{border-bottom:0}
.dk{font-weight:700;font-size:13px;padding-top:6px}
.dfiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.file{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;max-width:100%}
.file a{color:var(--ink);font-weight:700;font-size:13px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.file a:hover{text-decoration:underline}
.ft{font-size:10px;font-weight:800;color:var(--primary);background:var(--primary-soft);border-radius:4px;padding:0 4px;margin-right:4px}
.rm{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;border-radius:6px}
.addfile{border:1.5px dashed var(--primary);background:transparent;color:var(--primary);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.addfile:disabled{opacity:.6;cursor:wait}
.copied{color:var(--s-offer);font-size:13px;font-weight:700}
.dv{border-top:1px solid var(--line);padding:8px 0}
.dv:first-child{border-top:0}
.dv .who{font-weight:700;font-size:13px}
.dv p{margin:4px 0 0;white-space:pre-wrap;font-size:14px}
.mlog{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.mlog:first-child{border-top:0}
.mlog summary{cursor:pointer}
.mlog pre{white-space:pre-wrap;margin:6px 0 0;font-family:inherit;font-size:13px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.memnote{font-size:13px;color:var(--muted);margin:0 0 10px}
.memmsg{font-size:14px;font-weight:700;color:var(--s-offer);margin:0 0 10px;min-height:1.4em}

@media (max-width:700px){
  h1{font-size:25px}
  .grid,.mgrid{grid-template-columns:1fr}
  .toolbar select{flex:1 1 40%}

<body>

        <input id="q" type="search" placeholder="名前・求人・メモで検索" aria-label="検索">

      </fieldset>

<script>
(function(){
  // ================= constants =================
  const STAGES = [
    {key:'doc',   label:'書類選考',     c:'var(--s-doc)'},
    {key:'first', label:'一次面接',     c:'var(--s-first)'},
    {key:'second',label:'二次面接',     c:'var(--s-second)'},
    {key:'final', label:'最終面接',     c:'var(--s-final)'},
    {key:'offer', label:'内定',         c:'var(--s-offer)'},
    {key:'joined',label:'入社',         c:'var(--s-joined)'},
    {key:'out',   label:'見送り・辞退', c:'var(--s-out)'}
  ];
  const FLOW = ['doc','first','second','final','offer','joined'];
  const OLD_FLOW = ['doc','first','final','offer']; // 第1版の「どこまで進んだか」の数字は、この並びで保存されている
  const ROUNDS = [{k:'first',label:'一次面接'},{k:'second',label:'二次面接'},{k:'final',label:'最終面接'}];
  const OUT_REASONS = ['当社から見送り','本人が辞退（他社に決定）','本人が辞退（その他）','連絡がとれない','内定辞退'];
  const END_STAGES = ['out','offer','joined']; // 1年たつと自動で削除される段階
  const PURGE_DAYS = 365, WARN_DAYS = 30;
  const SOURCES = ['求人サイト','自社サイト','エージェント','社員紹介','SNS','その他'];
  const JOB_ST = [
    {k:'prep',label:'準備中',c:'var(--s-doc)'},
    {k:'open',label:'募集中',c:'var(--s-offer)'},
    {k:'paused',label:'一時停止',c:'var(--s-final)'},
    {k:'closed',label:'終了',c:'var(--s-out)'}
  ];
  const KINDS = [{k:'resume',label:'履歴書'},{k:'career',label:'職務経歴書'},{k:'other',label:'その他'}];
  const DUR = 60, STALE_DAYS = 7, SOON_DAYS = 3, CAL = 'Google Calendar';
  const DAY = 86400000;
  const stageOf = k => STAGES.find(s => s.key === k) || STAGES[0];
  const jobSt = k => JOB_ST.find(s => s.k === k) || JOB_ST[0];

  // ================= state =================
  const S = { apps:[], jobs:[], agents:[], tpls:[], settings:{}, prefs:{}, members:{}, revAll:{}, revMine:{},
    docRevs:[], mailLogs:{}, archive:[], memMsg:'',
    loaded:false, tab:'apps', view:'list', q:'', fJob:'', fSrc:'', fStage:'', sort:'updated', range:'3m',
    readOnly:false, admin:false, editing:null, tplEdit:null };
  let db=null, user=null, assets=null, mcp=null, sample=null, downloads=null, myId=null, localMode=false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  function banner(msg){ const b=$('banner'); b.textContent=msg||''; b.classList.toggle('show',!!msg); }

  // ================= dates =================
  const W = '日月火水木金土';
  const pad = n => String(n).padStart(2,'0');
  function toDate(s){ if(!s) return null; const d=new Date(s); return isNaN(d) ? null : d; }
  function fmtDT(s){ const d=toDate(s); if(!d) return ''; return (d.getMonth()+1)+'/'+d.getDate()+'('+W[d.getDay()]+') '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function fmtD(ms){ if(!ms) return ''; const d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate(); }
  function fmtLong(s){ const d=toDate(s); if(!d) return ''; const e=new Date(d.getTime()+DUR*60000);
    return (d.getMonth()+1)+'月'+d.getDate()+'日（'+W[d.getDay()]+'）'+pad(d.getHours())+':'+pad(d.getMinutes())+'〜'+pad(e.getHours())+':'+pad(e.getMinutes()); }
  function localISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00'; }
  function localInput(d){ return localISO(d).slice(0,16); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function whenClass(s){ const d=toDate(s); if(!d) return ''; const t=d.getTime(), now=Date.now();
    if(t<now) return 'past'; if(t-now<SOON_DAYS*DAY) return 'soon'; return ''; }

  // ================= domain helpers =================
  const jobOf = a => a.jobId ? S.jobs.find(j => j.id === a.jobId) : null;
  function jobLabel(a){ const j=jobOf(a); return j ? j.title : (a.position || ''); }
  const agentOf = a => a.agentId ? S.agents.find(x => x.id === a.agentId) : null;
  function emptyRound(){ return {at:'', interviewers:[], extra:'', meet:false, event:null}; }
  function roundsOf(a){
    const r = (a && a.rounds) || {};
    const out = {};
    ROUNDS.forEach(x => { out[x.k] = Object.assign(emptyRound(), r[x.k] || {}); out[x.k].interviewers = Array.isArray(out[x.k].interviewers) ? out[x.k].interviewers.slice() : []; });
    if(a && !a.rounds && a.interviewAt) out.first.at = a.interviewAt; // older data
    return out;
  }
  function nextIv(a){
    const r = roundsOf(a), list = [];
    ROUNDS.forEach(x => { const d=toDate(r[x.k].at); if(d) list.push({at:r[x.k].at, t:d.getTime(), label:x.label}); });
    const now = Date.now();
    const fut = list.filter(x => x.t >= now).sort((p,q) => p.t-q.t);
    if(fut.length) return fut[0];
    const past = list.sort((p,q) => q.t-p.t);
    return past[0] || null;
  }
  const isActive = a => ['doc','first','second','final'].includes(a.stage || 'doc');
  const isStale = a => isActive(a) && (Date.now() - (a.updatedAt || a.createdAt || 0)) > STALE_DAYS*DAY;
  // 第2版は reachedKey（段階の名前）で保存する。第1版の数字だけが残っているデータは、第1版の並びで読み替える
  const reachedOf = a => {
    if(a.reachedKey && FLOW.includes(a.reachedKey)) return FLOW.indexOf(a.reachedKey);
    if(typeof a.reached === 'number') return Math.max(0, FLOW.indexOf(OLD_FLOW[a.reached] || 'doc'));
    return Math.max(0, FLOW.indexOf(a.stage || 'doc'));
  };
  function reviewsFor(appId){
    const out = [];
    const add = (uid, items) => { Object.keys(items || {}).forEach(k => { const v = items[k]; if(v && v.app === appId) out.push(Object.assign({uid}, v)); }); };
    if(S.admin) Object.keys(S.revAll).forEach(uid => add(uid, S.revAll[uid]));
    else if(myId) add(myId, S.revMine);
    return out;
  }
  function avgFor(appId){
    const r = reviewsFor(appId).filter(x => x.rating > 0);
    if(!r.length) return {avg:0, n:0};
    return {avg: r.reduce((s,x) => s+x.rating, 0)/r.length, n:r.length};
  }
  const attCount = a => Array.isArray(a.attachments) ? a.attachments.length : 0;
  function myItems(){ return S.admin ? (S.revAll[myId] || {}) : S.revMine; }
  // 書類選考の評価（全員が読める）
  const docRevsFor = appId => S.docRevs.filter(v => v && v.app === appId);
  function docAvgFor(appId){
    const r = docRevsFor(appId).filter(x => x.rating > 0);
    if(!r.length) return {avg:0, n:0};
    return {avg: r.reduce((s,x) => s+x.rating, 0)/r.length, n:r.length};
  }
  // 自動削除の起点：見送り・辞退＝「見送り・辞退にした日」、内定・入社＝「内定にした日」
  const anchorOf = a => a.stage === 'out' ? (a.outAt || null) : ((a.stage === 'offer' || a.stage === 'joined') ? (a.offerAt || null) : null);
  const purgeAtOf = a => { const t = anchorOf(a); return t ? t + PURGE_DAYS*DAY : null; };
  function fmtYMD(ms){ const d = new Date(ms); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
  // 段階を変えたときに自動で記録する日付
  function stageFields(prev, stage){
    const now = Date.now();
    return {
      offerAt: (stage === 'offer' || stage === 'joined') ? ((prev && prev.offerAt) || now) : ((prev && prev.offerAt) || null),
      outAt: stage === 'out' ? ((prev && prev.stage === 'out' && prev.outAt) || now) : null
    };
  }

  // ================= small renderers =================
  function starsHTML(n){
    let s = '<span class="stars" aria-label="評価 '+n+'／5">';
    for(let i=1;i<=5;i++) s += i<=Math.round(n) ? '★' : '<span class="off">★</span>';
    return s+'</span>';
  }
  function ratingHTML(a, doc){
    const {avg,n} = doc ? docAvgFor(a.id) : avgFor(a.id);
    if(!n) return '<span class="muted small">未評価</span>';
    return starsHTML(avg)+' <span class="small">'+avg.toFixed(1)+'</span> <span class="muted small">('+n+'件)</span>';
  }
  function trackHTML(stage){
    const st = stageOf(stage);
    if(st.key === 'out') return '<span class="pill" style="--c:'+st.c+'">'+st.label+'</span>';
    const idx = FLOW.indexOf(st.key);
    let d = '<div class="track" style="--c:'+st.c+'"><div class="dots" aria-hidden="true">';
    FLOW.forEach((k,i) => { if(i>0) d += '<b class="'+(i<=idx?'done':'')+'"></b>'; d += '<i class="'+(i<idx?'done':i===idx?'now':'')+'"></i>'; });
    return d+'</div><span class="lbl">'+st.label+'</span></div>';
  }
  function ivHTML(a){
    const n = nextIv(a);
    if(!n) return '<span class="muted">—</span>';
    return '<span class="when '+whenClass(n.at)+'">'+fmtDT(n.at)+'</span><span class="rl">'+n.label+'</span>';
  }
  function docTags(a){
    const att = Array.isArray(a.attachments) ? a.attachments : [];
    if(!att.length) return '<span class="muted">—</span>';
    return KINDS.filter(k => att.some(f => f.kind === k.k)).map(k => '<span class="tag">'+k.label+'</span>').join('');
  }
  function srcHTML(a){
    if(!a.source) return '<span class="muted">—</span>';
    if(a.source === 'エージェント'){ const ag = agentOf(a); return '<span class="tag agent">エージェント</span>'+(ag ? '<span class="rl">'+esc(ag.name)+'</span>' : ''); }
    return esc(a.source);
  }

  async function resolveNames(root){
    const els = (root || document).querySelectorAll('[data-uid]');
    if(!els.length) return;
    if(!user){ els.forEach(el => el.textContent = 'メンバー'); return; }
    const ids = [...new Set([...els].map(el => el.dataset.uid).filter(Boolean))];
    let ps = {};
    try { ps = await user.profiles(ids) || {}; } catch(e){}
    (root || document).querySelectorAll('[data-uid]').forEach(el => {
      const p = ps[el.dataset.uid];
      el.textContent = (p && p.isMe) ? 'あなた' : ((p && p.name) || 'メンバー');
    });
  }

  // ================= render =================
  function render(){
    // tabs
    document.querySelector('[data-tab="stats"]').hidden = !S.admin;
    document.querySelector('[data-tab="members"]').hidden = !S.admin;
    if((S.tab === 'stats' || S.tab === 'members') && !S.admin) S.tab = 'apps';
    document.querySelectorAll('#tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
    ['apps','jobs','agents','stats','mail','members'].forEach(t => $('tab-'+t).hidden = t !== S.tab);
    $('csvBtn').hidden = !downloads;

    const add = $('addBtn');
    const label = {apps:'＋ 応募者を追加', jobs:'＋ 求人を追加', agents:'＋ エージェントを追加'}[S.tab];
    add.hidden = !label || S.readOnly; if(label) add.textContent = label;
    $('pasteBtn').hidden = S.tab !== 'apps' || S.readOnly || !sample;

    const active = S.apps.filter(isActive).length;
    $('summary').textContent = S.loaded ? ('応募者 '+S.apps.length+'名、選考中 '+active+'名、募集中の求人 '+S.jobs.filter(j => j.status === 'open').length+'件') : '読み込み中…';

    if(S.tab === 'apps') renderApps();
    else if(S.tab === 'jobs') renderJobs();
    else if(S.tab === 'agents') renderAgents();
    else if(S.tab === 'stats') renderStats();
    else if(S.tab === 'mail') renderMail();
    else if(S.tab === 'members') renderMembers();
  }

  // ---------- applicants ----------
  function filtered(){
    const q = S.q.trim().toLowerCase();
    const arr = S.apps.filter(a => {
      if(S.fJob){ if(S.fJob.startsWith('p:')){ if(a.jobId || a.position !== S.fJob.slice(2)) return false; } else if(a.jobId !== S.fJob) return false; }
      if(S.fSrc && a.source !== S.fSrc) return false;
      if(S.fStage && (a.stage||'doc') !== S.fStage) return false;
      if(q){
        const ag = agentOf(a);
        const hay = [a.name,a.kana,jobLabel(a),a.source,a.email,a.phone,a.memo,ag && ag.name].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    const now = Date.now();
    const ivKey = a => { const n = nextIv(a); if(!n) return Infinity; const t = new Date(n.at).getTime(); return t < now ? 1e15 + (now - t) : t; };
    const cmp = {
      updated:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),
      applied:(a,b)=>String(b.appliedAt||'').localeCompare(String(a.appliedAt||'')),
      rating:(a,b)=> S.admin ? avgFor(b.id).avg-avgFor(a.id).avg : docAvgFor(b.id).avg-docAvgFor(a.id).avg,
      name:(a,b)=>String(a.kana||a.name||'').localeCompare(String(b.kana||b.name||''),'ja'),
      interview:(a,b)=>ivKey(a)-ivKey(b)
    }[S.sort];
    return arr.sort(cmp);
  }

  function renderApps(){
    // notices
    const now = Date.now();
    const soon = S.apps.filter(a => isActive(a)).map(a => ({a, n:nextIv(a)}))
      .filter(x => x.n && new Date(x.n.at).getTime() >= now && new Date(x.n.at).getTime() - now < SOON_DAYS*DAY)
      .sort((p,q) => new Date(p.n.at) - new Date(q.n.at));
    const stale = S.apps.filter(isStale).sort((p,q) => (p.updatedAt||0)-(q.updatedAt||0));
    let nh = '';
    if(soon.length){
      nh += '<div class="notice soon"><h3>面接が近い人（'+SOON_DAYS+'日以内）</h3><ul>';
      soon.forEach(x => nh += '<li><button type="button" data-open="'+esc(x.a.id)+'"><b>'+esc(x.a.name)+'</b> さん　'+x.n.label+'　'+fmtDT(x.n.at)+'</button></li>');
      nh += '</ul></div>';
    }
    if(stale.length){
      nh += '<div class="notice stale"><h3>'+STALE_DAYS+'日以上動きがない人</h3><ul>';
      stale.forEach(a => { const days = Math.floor((now-(a.updatedAt||a.createdAt||0))/DAY);
        nh += '<li><button type="button" data-open="'+esc(a.id)+'"><b>'+esc(a.name)+'</b> さん　'+stageOf(a.stage).label+'のまま '+days+'日</button></li>'; });
      nh += '</ul></div>';
    }
    if(S.admin){
      const dying = S.apps.filter(a => { const p = purgeAtOf(a); return p && p - now <= WARN_DAYS*DAY; }).sort((p,q) => purgeAtOf(p) - purgeAtOf(q));
      if(dying.length){
        nh += '<div class="notice del"><h3>まもなく削除される人</h3><ul>';
        dying.forEach(a => nh += '<li><button type="button" data-open="'+esc(a.id)+'"><b>'+esc(a.name)+'</b> さん　削除予定 '+fmtYMD(purgeAtOf(a))+'</button></li>');
        nh += '</ul></div>';
      }
    }
    $('notices').className = nh ? 'notices' : '';
    $('notices').innerHTML = nh;

    $('stages').innerHTML = STAGES.map(s => {
      const n = S.apps.filter(a => (a.stage||'doc') === s.key).length;
      return '<button type="button" class="chip" data-stage="'+s.key+'" style="--c:'+s.c+'" aria-pressed="'+(S.fStage===s.key)+'"><span class="dot"></span>'+s.label+'<span class="n">'+n+'</span></button>';
    }).join('');

    // job filter
    const legacy = [...new Set(S.apps.filter(a => !a.jobId && a.position).map(a => a.position))];
    const jobsSorted = sortedJobs();
    const validJob = !S.fJob || jobsSorted.some(j => j.id === S.fJob) || legacy.some(p => 'p:'+p === S.fJob);
    if(!validJob) S.fJob = '';
    $('fJob').innerHTML = '<option value="">すべての求人</option>' + jobsSorted.map(j => '<option value="'+esc(j.id)+'"'+(j.id===S.fJob?' selected':'')+'>'+esc(j.title)+(j.dept?'（'+esc(j.dept)+'）':'')+'</option>').join('')
      + legacy.map(p => '<option value="p:'+esc(p)+'"'+('p:'+p===S.fJob?' selected':'')+'>'+esc(p)+'</option>').join('');
    $('fSrc').innerHTML = '<option value="">すべての経路</option>' + SOURCES.map(p => '<option'+(p===S.fSrc?' selected':'')+'>'+p+'</option>').join('');
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));

    const main = $('appsMain');
    if(!S.loaded){ main.innerHTML = '<div class="panel state">読み込み中…</div>'; return; }
    if(!S.apps.length){
      main.innerHTML = '<div class="panel state"><strong>まだ応募者がいません</strong>'+(S.readOnly?'登録されるとここに表示されます。':'「＋ 応募者を追加」か「エージェントのメールから登録」で最初の1人を登録しましょう。')+'</div>';
      return;
    }
    const rows = filtered();
    if(S.view === 'list') renderList(main, rows); else renderBoard(main, rows);
    resolveNames(main);
  }

  function renderList(main, rows){
    if(!rows.length){ main.innerHTML = '<div class="panel state"><strong>条件に合う応募者がいません</strong>検索語や絞り込みを変えてみてください。</div>'; return; }
    let h = '<div class="panel"><div class="scroll"><table><thead><tr><th>氏名</th><th>年齢</th><th>応募求人</th><th>応募経路</th><th>選考ステータス</th><th>次の面接</th><th>書類選考の評価</th>'+(S.admin?'<th>面接評価</th>':'')+'<th>書類</th><th>最終更新</th></tr></thead><tbody>';
    rows.forEach(a => {
      h += '<tr tabindex="0" data-open="'+esc(a.id)+'">'
        + '<td><div class="nm">'+esc(a.name)+(isStale(a)?'<span class="flag">'+STALE_DAYS+'日以上動きなし</span>':'')+'</div>'+(a.kana?'<div class="kana">'+esc(a.kana)+'</div>':'')+'</td>'
        + '<td>'+(a.age?esc(a.age)+'歳':'<span class="muted">—</span>')+'</td>'
        + '<td>'+(jobLabel(a)?esc(jobLabel(a)):'<span class="muted">—</span>')+'</td>'
        + '<td>'+srcHTML(a)+'</td>'
        + '<td>'+trackHTML(a.stage)+'</td>'
        + '<td>'+ivHTML(a)+'</td>'
        + '<td>'+ratingHTML(a, true)+'</td>'
        + (S.admin ? '<td>'+ratingHTML(a)+'</td>' : '')
        + '<td>'+docTags(a)+'</td>'
        + '<td class="small"><span class="muted">'+fmtD(a.updatedAt)+'</span> '+(a.updatedBy?'<span data-uid="'+esc(a.updatedBy)+'"></span>':'')+'</td>'
        + '</tr>';
    });
    main.innerHTML = h + '</tbody></table></div></div>';
  }

  function renderBoard(main, rows){
    let h = '<div class="board">';
    STAGES.forEach(s => {
      const items = rows.filter(a => (a.stage||'doc') === s.key);
      h += '<section class="col'+(s.key === 'out' ? ' out' : '')+'" data-drop="'+s.key+'" style="--c:'+s.c+'"><h3>'+s.label+'<span>'+items.length+'</span></h3>';
      if(!items.length) h += '<div class="empty">'+(S.readOnly?'なし':'ここにカードをドラッグ')+'</div>';
      items.forEach(a => {
        const n = nextIv(a);
        const rt = avgFor(a.id);
        h += '<button type="button" class="card" draggable="'+(!S.readOnly)+'" data-open="'+esc(a.id)+'">'
          + '<div class="nm">'+esc(a.name)+'</div>'
          + '<div class="meta">'+esc(jobLabel(a) || '求人未設定')+(a.source?'／'+esc(a.source):'')+'</div>'
          + (n ? '<div class="nx '+(whenClass(n.at) === 'soon' ? 'soon' : '')+'">'+n.label+' '+fmtDT(n.at)+'</div>' : '')
          + (isStale(a)?'<div class="flag">'+STALE_DAYS+'日以上動きなし</div>':'')
          + '<div class="foot"><span class="muted">📎 '+attCount(a)+'</span>'+(S.admin ? (rt.n ? '<b><span class="star">★</span>'+rt.avg.toFixed(1)+'</b>' : '<span class="muted">未評価</span>') : '')+'</div>'
          + '</button>';
      });
      h += '</section>';
    });
    main.innerHTML = h + '</div>';
  }

  // ---------- jobs ----------
  function sortedJobs(){
    const order = {open:0, prep:1, paused:2, closed:3};
    return S.jobs.slice().sort((a,b) => (order[a.status]??9)-(order[b.status]??9) || String(a.title||'').localeCompare(String(b.title||''),'ja'));
  }
  function renderJobs(){
    const el = $('tab-jobs');
    let h = '<div class="sectionhead"><p>募集している職種を登録すると、応募者の登録画面で選べるようになります。</p></div>';
    if(!S.loaded){ el.innerHTML = h+'<div class="panel state">読み込み中…</div>'; return; }
    if(!S.jobs.length){ el.innerHTML = h+'<div class="panel state"><strong>まだ求人がありません</strong>'+(S.readOnly?'':'「＋ 求人を追加」から登録しましょう。')+'</div>'; return; }
    h += '<div class="cards">';
    sortedJobs().forEach(j => {
      const apps = S.apps.filter(a => a.jobId === j.id);
      const st = jobSt(j.status);
      h += '<div class="jcard" role="button" tabindex="0" data-job="'+esc(j.id)+'">'
        + '<div class="row"><h3>'+esc(j.title)+'</h3><span class="pill" style="--c:'+st.c+'">'+st.label+'</span></div>'
        + '<div class="muted small">'+(j.dept?esc(j.dept):'部署未設定')+'</div>'
        + '<div class="nums"><div><b>'+apps.length+'</b>応募</div><div><b>'+apps.filter(isActive).length+'</b>選考中</div><div><b>'+apps.filter(a => a.stage==='offer').length+'</b>内定</div></div>'
        + (apps.length ? '<button type="button" class="linkbtn" data-showjob="'+esc(j.id)+'">この求人の応募者を見る</button>' : '')
        + '</div>';
    });
    el.innerHTML = h + '</div>';
  }

  // ---------- agents ----------
  function renderAgents(){
    const el = $('tab-agents');
    let h = '<div class="sectionhead"><p>一度登録したエージェント会社は、応募者の登録画面で選ぶだけで入力できます。エージェントの方はこのボードを見られません。</p></div>';
    if(!S.loaded){ el.innerHTML = h+'<div class="panel state">読み込み中…</div>'; return; }
    if(!S.agents.length){ el.innerHTML = h+'<div class="panel state"><strong>まだエージェントが登録されていません</strong>'+(S.readOnly?'':'「＋ エージェントを追加」か、応募者の登録画面から登録できます。')+'</div>'; return; }
    h += '<div class="cards">';
    S.agents.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja')).forEach(ag => {
      const apps = S.apps.filter(a => a.agentId === ag.id);
      h += '<div class="jcard" role="button" tabindex="0" data-agent="'+esc(ag.id)+'">'
        + '<h3>'+esc(ag.name)+'</h3>'
        + '<div class="muted small">'+(ag.contactName?'担当：'+esc(ag.contactName):'担当者未登録')+(ag.contact?'　'+esc(ag.contact):'')+'</div>'
        + '<div class="nums"><div><b>'+apps.length+'</b>紹介</div><div><b>'+apps.filter(isActive).length+'</b>選考中</div><div><b>'+apps.filter(a => a.stage==='offer').length+'</b>内定</div></div>'
        + '</div>';
    });
    el.innerHTML = h + '</div>';
  }

  // ---------- stats ----------
  function rangeOf(k){
    const n = new Date(), y = n.getFullYear(), m = n.getMonth();
    if(k==='month') return [new Date(y,m,1), new Date(y,m+1,1)];
    if(k==='last') return [new Date(y,m-1,1), new Date(y,m,1)];
    if(k==='3m') return [new Date(y,m-2,1), new Date(y,m+1,1)];
    if(k==='fy'){ const s = m>=3 ? new Date(y,3,1) : new Date(y-1,3,1); return [s, new Date(s.getFullYear()+1,3,1)]; }
    return [null,null];
  }
  function appDate(a){ return a.appliedAt ? new Date(a.appliedAt+'T00:00:00') : new Date(a.createdAt || 0); }
  function barsHTML(rows, color){
    if(!rows.length) return '<p class="muted small">データがありません</p>';
    const max = Math.max(1, ...rows.map(r => r.value));
    return '<div class="bars">'+rows.map(r => '<div class="bar"><span class="lab" title="'+esc(r.label)+'">'+esc(r.label)+'</span><span class="trk"><span class="fill" style="width:'+(r.value/max*100)+'%;--c:'+(r.c||color||'var(--primary)')+'"></span></span><span class="val">'+r.value+(r.sub?'<span class="muted small"> '+r.sub+'</span>':'')+'</span></div>').join('')+'</div>';
  }
  function statRecords(){
    const recs = S.apps.map(a => ({date:appDate(a), source:a.source||'', job:jobLabel(a)||'未設定', agent:a.source === 'エージェント' ? ((agentOf(a)||{}).name || '未設定') : null,
      reached:reachedOf(a), stage:a.stage||'doc', reason:a.outReason||'', live:true}));
    // 1年たって自動で削除した人の、集計用の記録
    S.archive.forEach(r => recs.push({date:new Date((r.appliedMonth||'1970-01')+'-01T00:00:00'), source:r.source||'', job:r.jobTitle||'未設定', agent:r.source === 'エージェント' ? (r.agentName || '未設定') : null,
      reached:Math.max(0, FLOW.indexOf(r.reached||'doc')), stage:r.stage||'out', reason:r.outReason||'', live:false}));
    return recs;
  }
  function renderStats(){
    const el = $('tab-stats');
    if(!S.admin){ el.innerHTML = ''; return; }
    const [s,e] = rangeOf(S.range);
    const all = statRecords();
    const apps = all.filter(r => !s || (r.date >= s && r.date < e));
    const total = apps.length, cnt = f => apps.filter(f).length;
    const pct = v => total ? Math.round(v/total*100) : 0;
    const opts = [['month','今月'],['last','先月'],['3m','直近3ヶ月'],['fy','今年度（4月〜）'],['all','全期間']];
    let h = '<div class="sectionhead"><p>集計は採用担当者だけに表示されています。応募日で期間を絞り込みます。1年たって自動で削除した人の記録も、数に含めています。</p>'
      + '<select class="selpill" id="rangeSel" aria-label="集計期間">'+opts.map(o => '<option value="'+o[0]+'"'+(o[0]===S.range?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>';
    const active = cnt(r => r.live && ['doc','first','second','final'].includes(r.stage));
    const offers = cnt(r => r.stage === 'offer'), joined = cnt(r => r.stage === 'joined');
    h += '<div class="spanel" style="margin-bottom:12px"><div class="totals">'
      + '<div><b>'+total+'</b>応募数</div><div><b>'+active+'</b>選考中</div><div><b>'+offers+'</b>内定</div>'
      + '<div><b>'+pct(offers)+'%</b>内定率</div><div><b>'+joined+'</b>入社数</div><div><b>'+pct(joined)+'%</b>入社率</div></div>'
      + '<p class="hint" style="margin:8px 0 0">内定率は「内定」のままの人だけで数えます。入社した人は含めないので、入社が決まるたびに内定率は下がって見えます（入社率と合わせて見てください）。</p></div>';
    h += '<div class="statgrid">';
    // funnel
    const f = FLOW.map((k,i) => i === 0 ? total : cnt(r => r.reached >= i));
    const fl = ['応募（書類選考）','一次面接','二次面接','最終面接','内定','入社'];
    const fc = FLOW.map(k => 'var(--s-'+k+')');
    h += '<div class="spanel"><h3>選考の通過率</h3>'+barsHTML(f.map((v,i) => ({label:fl[i], value:v, c:fc[i], sub: i===0 ? '' : (f[i-1] ? Math.round(v/f[i-1]*100)+'%' : '—')})))
      + '<p class="hint">右の％は、ひとつ前の段階から進んだ割合です。見送り・辞退の人も、どこまで進んだかで数えています。二次面接を飛ばした人は、二次面接も通過したものとして数えます。</p></div>';
    // source
    const srcLabel = r => r.source || '未設定';
    const bySrc = [...SOURCES, '未設定'].map(l => ({label:l, value:cnt(r => srcLabel(r) === l), sub:'内定'+cnt(r => srcLabel(r) === l && r.stage === 'offer')})).filter(r => r.value);
    h += '<div class="spanel"><h3>応募経路別の応募数</h3>'+barsHTML(bySrc.sort((a,b)=>b.value-a.value))+'</div>';
    // job
    const jobMap = {};
    apps.forEach(r => { jobMap[r.job] = (jobMap[r.job]||0)+1; });
    h += '<div class="spanel"><h3>求人別の応募数</h3>'+barsHTML(Object.keys(jobMap).map(k => ({label:k, value:jobMap[k]})).sort((a,b)=>b.value-a.value), 'var(--s-first)')+'</div>';
    // agent
    const agApps = apps.filter(r => r.agent !== null);
    if(agApps.length){
      const am = {}; agApps.forEach(r => { am[r.agent] = (am[r.agent]||0)+1; });
      h += '<div class="spanel"><h3>エージェント別の紹介数</h3>'+barsHTML(Object.keys(am).map(k => ({label:k, value:am[k]})).sort((a,b)=>b.value-a.value), 'var(--s-final)')+'</div>';
    }
    // out reasons
    const rm = {}; apps.filter(r => r.stage === 'out').forEach(r => { const l = r.reason || '理由を選んでいない'; rm[l] = (rm[l]||0)+1; });
    h += '<div class="spanel"><h3>見送り・辞退の理由別</h3>'+barsHTML([...OUT_REASONS, '理由を選んでいない'].filter(l => rm[l]).map(l => ({label:l, value:rm[l]})), 'var(--s-out)')+'</div>';
    // monthly
    let ms, me;
    if(s){ ms = new Date(s); me = new Date(e); }
    else { const n = new Date(); me = new Date(n.getFullYear(), n.getMonth()+1, 1); ms = new Date(n.getFullYear(), n.getMonth()-11, 1);
      const first = all.length ? new Date(Math.min(...all.map(r => r.date.getTime()))) : ms;
      if(first > ms) ms = new Date(first.getFullYear(), first.getMonth(), 1); }
    const months = [];
    for(let d = new Date(ms); d < me; d = new Date(d.getFullYear(), d.getMonth()+1, 1)) months.push(d);
    const mv = months.map(d => all.filter(r => r.date.getFullYear()===d.getFullYear() && r.date.getMonth()===d.getMonth()).length);
    const mmax = Math.max(1, ...mv);
    h += '<div class="spanel"><h3>月別の応募数</h3><div class="cols">'+months.map((d,i) => '<div class="cc"><span class="cv">'+mv[i]+'</span><span class="cb" style="height:'+(mv[i]/mmax*120)+'px"></span><span class="cl">'+(d.getMonth()===0||i===0?d.getFullYear()+'/':'')+(d.getMonth()+1)+'月</span></div>').join('')+'</div></div>';
    h += '</div>';
    // 応募者を削除したあとのメール履歴（消さずに残す）
    const ids = new Set(S.apps.map(a => a.id));

  // ================= writes =================
  function clean(o){ const r = {}; Object.keys(o).forEach(k => { if(o[k] !== undefined && k !== 'id') r[k] = o[k]; }); return r; }
  function newId(col){ if(db && !localMode) return db.collection(col).doc().id; return 'local'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function localList(col){ return {applicants:'apps', jobs:'jobs', agents:'agents', templates:'tpls'}[col]; }
  async function saveDoc(col, id, data){
    const body = clean(data);
    if(localMode || !db){ const key = localList(col); const i = S[key].findIndex(x => x.id === id);
      if(i >= 0) S[key][i] = Object.assign({id}, body); else S[key].push(Object.assign({id}, body)); render(); return true; }
    try { await db.collection(col).doc(id).set(body); return true; } catch(e){ writeError(e); return false; }
  }
  async function deleteDoc(col, id){
    if(localMode || !db){ const key = localList(col); S[key] = S[key].filter(x => x.id !== id); render(); return true; }
    try { await db.collection(col).doc(id).delete(); return true; } catch(e){ writeError(e); return false; }
  }
  async function saveApplicant(id, data){
    data.updatedAt = Date.now(); if(myId) data.updatedBy = myId;
    return saveDoc('applicants', id, data);
  }
  function writeError(e){
    const code = e && e.code;
    if(code === 'invalid_argument') banner('この操作をする権限がありません。採用担当者に依頼してください。');
    else if(code === 'quota_exceeded') banner('保存できる件数の上限に達しました。不要なデータを削除してから、もう一度保存してください。');
    else if(code === 'resource_exhausted') banner('操作が集中しています。少し待ってから、もう一度保存してください。');
    else banner('保存できませんでした。通信状況を確認して、もう一度保存してください。');
  }

  function paintEvStatus(r){

  // picker
  let pkTimer = null;
  async function pkSearch(r, q){
    const list = document.querySelector('[data-list="'+r+'"]'); if(!list) return;
    list.hidden = false; list.textContent = '';
    if(!user){ const d = document.createElement('div'); d.className = 'pk-none'; d.textContent = 'メンバーを検索できません。社外の参加者欄にメールアドレスを入力してください。'; list.appendChild(d); return; }
    let hits = [];
    try { hits = await user.search(q) || []; } catch(e){}
    if(!list.isConnected) return;
    list.textContent = '';
    hits = hits.filter(h => !formRounds[r].interviewers.includes(h.id) && !isLeft(h.id));
    if(!hits.length){ const d = document.createElement('div'); d.className = 'pk-none'; d.textContent = q ? '見つかりません。名前かメールアドレスで検索してください。' : '名前を入力して検索してください。'; list.appendChild(d); return; }

      b.textContent = h.isMe ? (h.name+'（あなた）') : h.name;

  const EMAIL_RE = /^[^\s@,;、]+@[^\s@,;、]+\.[^\s@,;、]+$/;
  async function attendeeEmails(r){
    const st = formRounds[r], emails = [], missing = [];
    if(st.interviewers.length){
      let ps = {}; if(user){ try { ps = await user.profiles(st.interviewers) || {}; } catch(e){} }
      st.interviewers.forEach(id => { const m = S.members[id]; if(m && m.email && EMAIL_RE.test(m.email)) emails.push(m.email); else { const p = ps[id]; missing.push((p && p.isMe) ? 'あなた' : ((p && p.name) || 'メンバー')); } });
    }
    String(st.extra||'').split(/[,\s、;]+/).map(s => s.trim()).filter(Boolean).forEach(s => { if(EMAIL_RE.test(s)) emails.push(s); });
    return {emails:[...new Set(emails)], missing};
  }
  function mcpMsg(e, isWrite){
    const c = e && e.code;
    if(c === 'server_not_connected') return 'Googleカレンダーが接続されていません。claude.ai の「設定 → コネクタ」で Google カレンダーを追加してください。';
    if(c === 'needs_reauth') return 'Googleカレンダーの接続が切れています。claude.ai の「設定 → コネクタ」で再接続してください。';
    if(c === 'selection_required') return '使う Google カレンダーの接続を選んでください（画面に出る案内に従ってください）。';
    if(c === 'not_in_manifest' || c === 'approval_required') return 'このページでの Google カレンダーの利用が許可されていません。もう一度ボタンを押すと確認が表示されます。';
    if(c === 'blocked_by_policy') return '組織の設定により、この操作は使えません。';
    if(c === 'tool_error') return 'Googleカレンダーがエラーを返しました：'+(e.message||'').slice(0,200);
    if(c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'この画面では Google カレンダー連携が使えません。';
    if(isWrite) return '登録できたか確認できませんでした。Googleカレンダーを開いて予定ができているか確認し、なければもう一度登録してください。';
    return '候補を取得できませんでした。少し待ってから、もう一度お試しください。';
  }
  async function suggest(r){
    if(!mcp) return;
    const {emails, missing} = await attendeeEmails(r);
    const sl = document.querySelector('[data-slots="'+r+'"]'); if(sl) sl.innerHTML = '';
    if(!emails.length){ calMsg(r, missing.length ? missing.join('、')+' さんのメールアドレスが登録されていません。「メール」タブの「あなたの設定」で登録してもらうか、社外の参加者欄にメールアドレスを入力してください。' : '先に担当面接官を選んでください。', true); return; }
    calBusy[r] = 's'; paintRounds();
    const start = new Date(); start.setDate(start.getDate()+1); start.setHours(0,0,0,0);
    const end = new Date(start.getTime()+14*DAY);
    try {
      const res = await mcp.callTool(CAL, 'suggest_time', {
        attendeeEmails: emails, startTime: localISO(start), endTime: localISO(end), durationMinutes: DUR,
        preferences: {startHour:'10:00', endHour:'17:00', excludeWeekends:true, pageSize:10}
      }, {cache:false});
      calBusy[r] = null; paintRounds();
      const p = res && res.payload; const slots = (p && Array.isArray(p.timeSlots)) ? p.timeSlots : [];
      const cands = [];
      slots.forEach(s => {
        const a = new Date(s.startTime || (s.start && s.start.dateTime)), b = new Date(s.endTime || (s.end && s.end.dateTime));
        if(isNaN(a) || isNaN(b)) return;
        let t = new Date(a); if(t.getMinutes() % 30){ t.setMinutes(t.getMinutes() < 30 ? 30 : 60, 0, 0); }
        let per = 0;
        while(t.getTime() + DUR*60000 <= b.getTime() && per < 3 && cands.length < 12){
          if(t.getHours() >= 10 && t.getHours()*60+t.getMinutes()+DUR <= 17*60) { cands.push(new Date(t)); per++; }
          t = new Date(t.getTime() + 60*60000);
        }
      });
      const box = document.querySelector('[data-slots="'+r+'"]');
      if(!cands.length){ calMsg(r, '2週間以内に全員の空いている時間が見つかりませんでした。日時を手で入力してください。', true); return; }
      box.innerHTML = cands.map(d => '<button type="button" data-slot="'+localInput(d)+'" data-r="'+r+'">'+fmtDT(localInput(d))+'</button>').join('');
      calMsg(r, '候補をクリックすると日時に入ります。'+(missing.length ? '（'+missing.join('、')+' さんはメールアドレスが未登録のため、空き時間に含まれていません）' : ''));
    } catch(e){ calBusy[r] = null; paintRounds(); calMsg(r, mcpMsg(e, false), true); }
  }
  async function createEvent(r){
    if(!mcp) return;
    const st = formRounds[r], label = ROUNDS.find(x => x.k === r).label;
    const name = $('name').value.trim();
    if(!name){ calMsg(r, '先に氏名を入力してください。', true); return; }
    const d = toDate(st.at);
    if(!d){ calMsg(r, '先に日時を入力するか、候補から選んでください。', true); return; }
    const {emails, missing} = await attendeeEmails(r);
    const jobSel = $('job').value; const job = S.jobs.find(j => j.id === jobSel);
    const jobText = job ? job.title : '';
    const input = {
      summary: '【'+label+'】'+name+' 様 面接'+(jobText ? '（'+jobText+'）' : ''),
      startTime: localISO(d), endTime: localISO(new Date(d.getTime()+DUR*60000)),
      description: '応募者：'+name+' 様\n'+(jobText ? '応募求人：'+jobText+'\n' : '')+'選考：'+label+'\n詳細は採用ボードで確認してください。'
    };
    if(S.settings && S.settings.venue) input.location = S.settings.venue;
    if(emails.length) input.attendees = emails.map(em => ({email: em}));
    if(st.meet) input.addGoogleMeetUrl = true;
    calBusy[r] = 'c'; paintRounds();
    try {
      const res = await mcp.callTool(CAL, 'create_event', input, {cache:false});
      calBusy[r] = null;
      const p = (res && res.payload) || {};
      const ev = {at: st.at, created: Date.now()};
      const eid = p.id || p.eventId || (p.event && p.event.id); if(typeof eid === 'string') ev.id = eid;
      const link = p.htmlLink || (p.event && p.event.htmlLink); if(typeof link === 'string') ev.link = link;
      st.event = ev;
      paintRounds();
      calMsg(r, 'Googleカレンダーに登録しました。'+(emails.length ? '面接官に招待を送りました。' : '')+(missing.length ? '（'+missing.join('、')+' さんはメールアドレスが未登録のため、招待していません）' : ''));
      await persistPatch({rounds: roundsForSave()});
    } catch(e){ calBusy[r] = null; paintRounds(); calMsg(r, mcpMsg(e, true), true); }
  }

      const name = form.querySelector('[data-tf=name]').value.trim(), subject = form.querySelector('[data-tf=subject]').value.trim(), body = form.querySelector('[data-tf=body]').value;
      const err = form.querySelector('[data-tferr]');
      if(!name || !subject || !body.trim()){ err.textContent = '名前・件名・本文をすべて入力してください。'; err.classList.add('show'); return; }
      const id = sv.dataset.tplsave === '__new' ? newId('templates') : sv.dataset.tplsave;
      const prev = S.tpls.find(x => x.id === id);
      const order = prev ? (prev.order||0) : (Math.max(0, ...S.tpls.map(x => x.order||0)) + 1);
      sv.disabled = true;
      const ok = await saveDoc('templates', id, {name, subject, body, order, updatedAt:Date.now()});
      sv.disabled = false;
      if(ok){ S.tplEdit = null; sv.blur(); renderMail(); }
      return;
    }
    const dl = t.closest('[data-tpldel]');
    if(dl){
      if(!dl.classList.contains('armed')){ dl.classList.add('armed'); dl.textContent='もう一度押すと削除'; setTimeout(()=>{ if(dl.isConnected){ dl.classList.remove('armed'); dl.textContent='削除'; } },3500); return; }
      if(await deleteDoc('templates', dl.dataset.tpldel)){ S.tplEdit = null; dl.blur(); renderMail(); }
    }
  });

  // ================= members (異動・退職) =================
  async function writeMember(uid, patch){
    const body = Object.assign({}, S.members[uid] || {}, patch, {updatedAt:Date.now()});
    if(localMode || !db){ S.members[uid] = body; return true; }
    try { await db.doc('members/'+uid).set(body); return true; } catch(err){ writeError(err); return false; }
  }
  async function patchApp(id, patch){ // 最終更新日時は変えずに書き足す
    if(localMode || !db){ const a = S.apps.find(x => x.id === id); if(a) Object.assign(a, patch); return true; }
    try { await db.collection('applicants').doc(id).update(patch); return true; } catch(err){ writeError(err); return false; }
  }
  async function leaveMember(uid){
    const now = Date.now(); let n = 0;
    for(const a of S.apps){
      const cur = a.rounds || {}, next = Object.assign({}, cur); let ch = false;
      ROUNDS.forEach(x => {
        const v = cur[x.k];
        if(!v || !Array.isArray(v.interviewers) || !v.interviewers.includes(uid)) return;
        const d = toDate(v.at); if(d && d.getTime() < now) return; // 終わった面接は、そのまま
        next[x.k] = Object.assign({}, v, {interviewers: v.interviewers.filter(i => i !== uid)}); ch = true; n++;
      });
      if(ch && !(await patchApp(a.id, {rounds: next}))) return '担当から外せませんでした。もう一度お試しください。';
    }
    if(!(await writeMember(uid, {status:'left', leftAt:now}))) return '保存できませんでした。もう一度お試しください。';
    return n ? n+'件の面接の担当から外しました。' : '担当から外す面接はありませんでした。';
  }
  async function returnMember(uid){
    if(!(await writeMember(uid, {status:'active', leftAt:null}))) return '保存できませんでした。もう一度お試しください。';
    return '在籍に戻しました。外れた担当は、元には戻りません。';
  }
  $('tab-members').addEventListener('click', async e => {
    const b = e.target.closest('[data-mem]'); if(!b || !S.admin || S.readOnly) return;
    const id = b.dataset.id, act = b.dataset.mem;
    if(act === 'leave' && !b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent = 'もう一度押すと異動・退職にします';
      setTimeout(() => { if(b.isConnected){ b.classList.remove('armed'); b.textContent = '異動・退職'; } }, 3500); return;
    }
    b.disabled = true;
    S.memMsg = act === 'leave' ? await leaveMember(id) : await returnMember(id);
    renderMembers();
  });

  // ================= 1年たった人の自動削除（採用担当者がボードを開いたとき） =================
  async function purgeApplicant(a){
    const arch = {jobId:a.jobId||'', jobTitle:jobLabel(a)||'', source:a.source||'', agentId:a.agentId||'', agentName:(agentOf(a)||{}).name||'',
      appliedMonth:(a.appliedAt || new Date(a.createdAt||Date.now()).toISOString().slice(0,10)).slice(0,7),
      reached:FLOW[reachedOf(a)], stage:a.stage||'', outReason:a.outReason||'', archivedAt:Date.now()};
    if(localMode || !db){ S.archive.push(Object.assign({id:a.id}, arch)); }
    else { try { await db.doc('archive/'+a.id).set(arch); } catch(err){ writeError(err); return false; } }
    (Array.isArray(a.attachments) ? a.attachments : []).forEach(f => { if(assets && f && f.id) assets.delete(f.id).catch(()=>{}); });
    await cleanReviews(a.id);
    return await deleteDoc('applicants', a.id);
  }
  let maintained = false, maintainTimer = null;
  async function autoMaintain(){
    if(maintained || !S.admin || S.readOnly || !S.loaded) return;
    maintained = true;
    const now = Date.now();
    // 第1版で登録済みの人は、起点の日の記録がない。第2版で初めてボードを開いた日を起点にする
    for(const a of S.apps.slice()){
      if(END_STAGES.includes(a.stage) && !anchorOf(a)){
        const patch = a.stage === 'out' ? {outAt:now} : {offerAt:now};
        if(await patchApp(a.id, patch)) Object.assign(a, patch);
      }
    }
    const due = S.apps.filter(a => { const p = purgeAtOf(a); return p && p <= now; });
    let n = 0;
    for(const a of due){ if(await purgeApplicant(a)) n++; }
    if(n) banner('選考が終わってから1年たった '+n+'名のデータを、自動で削除しました。集計用の記録だけを残しています。');
  }
  function scheduleMaintain(){ if(!maintainTimer) maintainTimer = setTimeout(autoMaintain, 3000); }

  // ================= CSV =================
  const csvCell = v => { let s = String(v == null ? '' : v); if(/^[=@\t\r]|^[+-](?![0-9])/.test(s)) s = "'"+s; return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csvDT = s => { const d = toDate(s); return d ? d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()) : ''; };
  const csvD = ms => ms ? fmtYMD(ms) : '';
  async function exportCsv(){
    if(!downloads) return;
    const btn = $('csvBtn'); btn.disabled = true; btn.textContent = '書き出しています…';
    try {
      const ids = new Set();
      S.docRevs.forEach(v => v.by && ids.add(v.by));
      if(S.admin) Object.keys(S.revAll).forEach(u => ids.add(u));
      let ps = {}; if(user && ids.size){ try { ps = await user.profiles([...ids]) || {}; } catch(e){} }
      const nm = id => { const p = ps[id]; return (p && p.name) || (p && p.isMe ? 'あなた' : 'メンバー'); };
      const head = ['氏名','ふりがな','年齢','電話番号','メールアドレス','個人情報の同意確認','求人','部署','応募経路','エージェント会社','推薦コメント','応募日','選考段階','見送り・辞退の理由','内定にした日','入社（予定）日',
        '一次面接の日時','二次面接の日時','最終面接の日時','書類選考の評価（平均）','書類選考の評価（内訳）','共有メモ','履歴書','職務経歴書','その他の書類','登録日','最終更新日'];
      if(S.admin) ROUNDS.forEach(x => { head.push(x.label+'の評価（平均）'); head.push(x.label+'の評価（内訳）'); });
      const rows = [head];
      S.apps.slice().sort((a,b) => String(b.appliedAt||'').localeCompare(String(a.appliedAt||''))).forEach(a => {
        const j = jobOf(a), ag = agentOf(a), r = roundsOf(a), att = Array.isArray(a.attachments) ? a.attachments : [];
        const dr = docRevsFor(a.id).filter(v => v.rating > 0), dAvg = dr.length ? (dr.reduce((s,v) => s+v.rating, 0)/dr.length).toFixed(1) : '';
        const row = [a.name, a.kana, a.age, a.phone, a.email, a.consent ? '確認済み' : '', jobLabel(a), j ? j.dept : '', a.source, ag ? ag.name : '', a.source === 'エージェント' ? a.agentComment : '', a.appliedAt,
          stageOf(a.stage).label, a.outReason, csvD(a.offerAt), a.joinDate,
          csvDT(r.first.at), csvDT(r.second.at), csvDT(r.final.at), dAvg,
          docRevsFor(a.id).map(v => nm(v.by)+'：★'+(v.rating||0)+(v.comment ? ' '+v.comment : '')).join(' ／ '),
          a.memo, att.some(f => f.kind === 'resume') ? 'あり' : '', att.some(f => f.kind === 'career') ? 'あり' : '', att.some(f => f.kind === 'other') ? 'あり' : '',
          csvD(a.createdAt), csvD(a.updatedAt)];
        if(S.admin) ROUNDS.forEach(x => {
          const rv = reviewsFor(a.id).filter(v => v.round === x.k), rs = rv.filter(v => v.rating > 0);
          row.push(rs.length ? (rs.reduce((s,v) => s+v.rating, 0)/rs.length).toFixed(1) : '');
          row.push(rv.map(v => nm(v.uid)+'：★'+(v.rating||0)+(v.comment ? ' '+v.comment : '')).join(' ／ '));
        });
        rows.push(row);
      });
      const csv = '﻿'+rows.map(r => r.map(csvCell).join(',')).join('\r\n');
      await downloads.save({filename:'採用ボード_応募者一覧_'+todayStr()+'.csv', data:csv});
    } catch(err){
      if(err && err.code !== 'declined') banner(err && err.code === 'rate_limited' ? '保存の確認が出たままです。少し待ってから、もう一度押してください。' : 'CSVを書き出せませんでした。もう一度お試しください。');
    }
    btn.disabled = false; btn.textContent = 'CSVで書き出す（全員分）';
  }
  $('csvBtn').addEventListener('click', exportCsv);

  // ================= global interactions =================
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(!b) return; S.tab = b.dataset.tab; S.tplEdit = null; if(document.activeElement) document.activeElement.blur(); render(); });
  $('addBtn').addEventListener('click', () => { if(S.tab === 'apps') openForm(null); else if(S.tab === 'jobs') openJob(null); else if(S.tab === 'agents') openAgent(null); });
  $('q').addEventListener('input', e => { S.q = e.target.value; render(); });
  $('fJob').addEventListener('change', e => { S.fJob = e.target.value; render(); });
  $('fSrc').addEventListener('change', e => { S.fSrc = e.target.value; render(); });
  $('sort').addEventListener('change', e => { S.sort = e.target.value; render(); });
  document.querySelector('.seg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; S.view = b.dataset.view; render(); });
  $('stages').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; S.fStage = S.fStage === b.dataset.stage ? '' : b.dataset.stage; render(); });
  $('notices').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if(b) openForm(b.dataset.open); });
  $('tab-jobs').addEventListener('click', e => {
    const sj = e.target.closest('[data-showjob]'); if(sj){ e.stopPropagation(); S.fJob = sj.dataset.showjob; S.fStage=''; S.q=''; $('q').value=''; S.tab='apps'; render(); return; }
    const c = e.target.closest('[data-job]'); if(c) openJob(c.dataset.job);
  });
  $('tab-jobs').addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('[data-job]')) openJob(e.target.dataset.job); });
  $('tab-agents').addEventListener('click', e => { const c = e.target.closest('[data-agent]'); if(c) openAgent(c.dataset.agent); });
  $('tab-agents').addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('[data-agent]')) openAgent(e.target.dataset.agent); });
  $('tab-stats').addEventListener('change', e => { if(e.target.id === 'rangeSel'){ S.range = e.target.value; renderStats(); } });

  const main = $('appsMain');
  main.addEventListener('click', e => { const t = e.target.closest('[data-open]'); if(t) openForm(t.dataset.open); });
  main.addEventListener('keydown', e => { if(e.key === 'Enter'){ const t = e.target.closest('tr[data-open]'); if(t) openForm(t.dataset.open); } });
  main.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if(!c || S.readOnly) return; e.dataTransfer.setData('text/plain', c.dataset.open); e.dataTransfer.effectAllowed='move'; c.classList.add('dragging'); });
  main.addEventListener('dragend', e => { const c = e.target.closest('.card'); if(c) c.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
  main.addEventListener('dragover', e => { const col = e.target.closest('[data-drop]'); if(!col || S.readOnly) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => { if(x!==col) x.classList.remove('over'); }); col.classList.add('over'); });
  main.addEventListener('dragleave', e => { const col = e.target.closest('[data-drop]'); if(col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
  main.addEventListener('drop', async e => {
    const col = e.target.closest('[data-drop]'); if(!col || S.readOnly) return;
    e.preventDefault(); col.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain'); const a = S.apps.find(x => x.id === id);
    if(!a || (a.stage||'doc') === col.dataset.drop) return;
    const stage = col.dataset.drop;
    const r = Math.max(reachedOf(a), FLOW.indexOf(stage));
    const extra = {};
    if(stage !== 'out') extra.outReason = '';
    if(stage !== 'offer' && stage !== 'joined') extra.joinDate = '';
    await saveApplicant(id, Object.assign({}, a, {stage, reached:r, reachedKey:FLOW[r]}, extra, stageFields(a, stage)));
  });

  // ================= start =================
  function startLocal(msg){ localMode = true; S.loaded = true; banner(msg); render(); }
  render();
  (async () => {
    const C = window.claude;
    if(!C || typeof C.use !== 'function'){ startLocal('この画面ではデータが保存されません。チームで使うときは claude.ai の共有リンクから開いてください。'); return; }
    let dbNs = null;
    try { [dbNs, user, assets, mcp, sample, downloads] = await Promise.all([C.use('db'), C.use('user'), C.use('assets'), C.use('mcp'), C.use('sample'), C.use('downloads')]); } catch(e){}
    render();
    if(user){
      try { myId = await user.id(); } catch(e){}
      try { S.admin = !!(await user.canEdit()); } catch(e){}
      try { const w = await user.can('data.write'); if(w === false){ S.readOnly = true; banner('閲覧のみできます。編集するには、採用担当者に権限をもらってください。'); } } catch(e){}
    }
    if(!dbNs){ startLocal('共有の保存先に接続できないため、入力内容はこのページを閉じると消えます。'); return; }
    db = dbNs;
    const onErr = err => { if(err && err.code === 'revoked'){ S.readOnly = true; render(); return; } banner('最新データの受信が止まりました。ページを開き直してください。'); };
    const toList = snap => snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    let got = 0; const mark = () => { got++; if(got >= 1){ S.loaded = true; } };
    db.collection('applicants').onSnapshot(s => { S.apps = toList(s); mark(); render(); if(S.admin) scheduleMaintain(); }, onErr);
    // 書類選考の評価（全員が読める）
    db.collection('docReviews').onSnapshot(s => { S.docRevs = toList(s); render(); if(dlg.open && S.editing && !$('docRevBox').contains(document.activeElement)) paintDocRevs(); }, () => {});
    db.collection('jobs').onSnapshot(s => { S.jobs = toList(s); render(); }, onErr);
    db.collection('agents').onSnapshot(s => { S.agents = toList(s); render(); }, onErr);
    db.collection('templates').onSnapshot(s => { S.tpls = toList(s); render(); }, onErr);
    db.doc('settings/main').onSnapshot(s => { S.settings = s.exists ? s.data() : {}; if(S.tab === 'mail') renderMail(); }, onErr);
    if(myId){
      db.collection('members').onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data() || {}); S.members = m; if(S.tab === 'mail') renderMail(); else if(S.tab === 'members') renderMembers(); }, () => {});
      db.doc('data/users/'+myId+'/prefs').onSnapshot(s => { S.prefs = s.exists ? s.data() : {}; if(S.tab === 'mail') renderMail(); }, () => {});
      if(S.admin) db.collection('reviews').onSnapshot(s => { const m = {}; s.docs.forEach(d => { const v = d.data(); m[d.id] = (v && v.items) || {}; }); S.revAll = m; render(); if(dlg.open && S.editing && !$('revBox').contains(document.activeElement)) paintReviews(); }, () => {});
      else db.doc('reviews/'+myId).onSnapshot(s => { S.revMine = s.exists ? ((s.data()||{}).items || {}) : {}; }, () => {});
      // メール履歴：採用担当者は全員分、メンバーは自分の分だけ
      const subMail = uid => db.collection('mailLogs/'+uid+'/items').onSnapshot(s => {
        Object.keys(S.mailLogs).forEach(k => { if(k.startsWith(uid+'/')) delete S.mailLogs[k]; });
        s.docs.forEach(d => { S.mailLogs[uid+'/'+d.id] = Object.assign({by:uid, id:d.id}, d.data()); });
        if(S.tab === 'stats') renderStats();
        if(dlg.open && S.editing) paintMailHist();
      }, () => {});
      if(S.admin){
        const subbed = {};
        db.collection('mailLogs').onSnapshot(s => { s.docs.forEach(d => { if(!subbed[d.id]){ subbed[d.id] = true; subMail(d.id); } }); }, () => {});
        db.collection('archive').onSnapshot(s => { S.archive = toList(s); if(S.tab === 'stats') renderStats(); }, () => {});
      } else subMail(myId);
    }
  })();
})();
</script>
</body>
</html>
